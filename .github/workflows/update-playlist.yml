name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright curl_cffi
          playwright install --with-deps chromium

      # ============================================================
      # Cache persistente per m3u8 risolti (NON committata nel repo)
      # ------------------------------------------------------------
      # Pattern: rolling cache
      #   - key univoca per run (run_id) → forza il salvataggio
      #   - restore-keys con prefisso → recupera la cache più recente
      # GitHub auto-pota le cache >7 giorni o quando supera 10 GB.
      # Il vault NON è cachato: costa ~2s rigenerarlo e un vault
      # stale romperebbe tutte le chiamate al worker.
      # ============================================================
      - name: Cache StreamCorner m3u8 results
        uses: actions/cache@v4
        with:
          path: .streamcorner_m3u8_cache.json
          key: streamcorner-m3u8-cache-${{ github.run_id }}
          restore-keys: |
            streamcorner-m3u8-cache-

      # ============================================================
      # ESTRATTORI ATTIVI
      # ============================================================
      - name: Extract DAMITV streams
        run: python damitv_extractor.py
        continue-on-error: true

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py
        continue-on-error: true

      - name: Extract CDN Live TV channels and events
        run: python cdnlivetv_extractor.py
        continue-on-error: true

      # ------------------------------------------------------------
      # StreamCorner: 250 item (invece di 400) per contenere i tempi.
      # Priorità basata su hit-rate reale (slingtv 11%, skygo 3%).
      # Niente --split: genera file non committati.
      # ------------------------------------------------------------
      - name: Extract StreamCorner streams
        run: |
          python streamcorner_extractor.py \
            --output streamcorner_COMPLETE.m3u \
            --playwright-workers 6 \
            --playwright-limit 250 \
            --playwright-priority "slingtv_channels,extra004,extra003,channels,mlb,nfl,nba,peacock_channels,skygo"
        continue-on-error: true
        timeout-minutes: 90

      - name: Extract WatchFooty streams
        run: python watchfooty_direct.py --max 20
        continue-on-error: true
        timeout-minutes: 25

      # ============================================================
      # STEP DISMESSI (commentati per storico)
      # ------------------------------------------------------------
      # xyzstreams  → proxy Node fragile, dipendenza esterna
      # SMTK        → canali geobloccati (richiedono VPN russa)
      # Extra Srces → 0 flussi funzionanti
      # ============================================================

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      # ============================================================
      # SAFETY: crea file mancanti prima del commit
      # ============================================================
      - name: Ensure all output files exist
        if: always()
        run: |
          for f in \
            combined_events.m3u \
            combined_events_checked.m3u \
            flussi_non_funzionanti.txt \
            damitv_events.m3u \
            daddylive_streams.m3u \
            cdnlivetv_channels.m3u \
            cdnlivetv_events.m3u \
            streamcorner_COMPLETE.m3u \
            streamcorner_VLC.m3u \
            watchfooty_events.m3u; do
            if [ ! -f "$f" ]; then
              echo "Crea $f (mancante)"
              if [[ "$f" == *.m3u ]]; then
                echo "#EXTM3U" > "$f"
              else
                touch "$f"
              fi
            fi
          done
          echo "--- Stato file ---"
          ls -la *.m3u *.txt 2>/dev/null || true

      - name: Commit and push
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
            streamcorner_COMPLETE.m3u
            streamcorner_VLC.m3u
            watchfooty_events.m3u
          skip_dirty_check: false