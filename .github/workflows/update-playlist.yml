name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright patchright curl_cffi
          playwright install --with-deps chromium
          patchright install chromium

      - name: Cache StreamCorner m3u8 results
        uses: actions/cache@v4
        with:
          path: .streamcorner_events_m3u8_cache.json
          key: streamcorner-m3u8-cache-${{ github.run_id }}
          restore-keys: |
            streamcorner-m3u8-cache-

      - name: Cache StreamCorner static config
        uses: actions/cache@v4
        with:
          path: .sc_static_cache.json
          key: sc-static-cache-${{ github.run_id }}
          restore-keys: |
            sc-static-cache-

      - name: Extract DAMITV streams
        run: python damitv_extractor.py
        continue-on-error: true

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py
        continue-on-error: true

      - name: Extract CDN Live TV channels and events
        run: python cdnlivetv_extractor.py
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════
      # MODIFICATO v13.5 → v13.6:
      #   • timeout 3 min → 10 min (obbligatorio: la nuova logica clicca
      #     i .stream-source-btn e attende il load dell'iframe → ~6-8 min
      #     per 25 match. Con 3 min il job veniva ucciso a metà)
      #   • step name aggiornato (v13.4 → v13.6)
      # ═══════════════════════════════════════════════════════════════
      - name: Extract StreamCorner streams (v13.6, source-click fix)
        run: |
          python streamcorner_extractor.py \
            --output streamcorner_COMPLETE.m3u \
            --playwright-workers 1 \
            --playwright-limit 3 \
            --ua desktop
        continue-on-error: true
        timeout-minutes: 10

      - name: Extract WatchFooty streams
        if: false
        run: python watchfooty_direct.py --max 20
        continue-on-error: true
        timeout-minutes: 25

      # ═══════════════════════════════════════════════════════════════
      # MODIFICATO v1.5 → v1.5.3:
      #   • step name aggiornato (v1.5 → v1.5.3)
      #   • codice invariato (fix atob regex è interna al file .py)
      # ═══════════════════════════════════════════════════════════════
      - name: Extract PirloTV streams (v1.5.3, atob-regex multi-line)
        run: |
          python pirlotv_extractor.py \
            --output pirlotv_COMPLETE.m3u \
            --max-per-site 20 \
            --timeout-per-site 300
        continue-on-error: true
        timeout-minutes: 25

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      - name: Ensure all output files exist
        if: always()
        run: |
          for f in \
            combined_events.m3u \
            combined_events_checked.m3u \
            flussi_non_funzionanti.txt \
            damitv_events.m3u \
            daddylive_streams.m3u \
            cdnlivetv_channels.m3u \
            cdnlivetv_events.m3u \
            streamcorner_COMPLETE.m3u \
            streamcorner_VLC.m3u \
            streamcorner_EVENTS_LIVE.m3u \
            streamcorner_KODI.m3u \
            pirlotv_COMPLETE.m3u \
            pirlotv_VLC.m3u \
            pirlotv_EVENTS_LIVE.m3u \
            pirlotv_capture.json \
            sc_capture.json \
            watchfooty_events.m3u; do
            if [ ! -f "$f" ]; then
              echo "Crea $f (mancante)"
              if [[ "$f" == *.m3u ]]; then
                echo "#EXTM3U" > "$f"
              elif [[ "$f" == *.json ]]; then
                echo "{}" > "$f"
              else
                touch "$f"
              fi
            fi
          done
          echo "--- Stato file ---"
          ls -la *.m3u *.txt *.json 2>/dev/null || true
          echo "--- Debug dirs ---"
          ls -la sc_assets/ 2>/dev/null | head -30 || true
          ls -la pirlotv_debug/ 2>/dev/null | head -30 || true
          echo "--- sc_stream_* post-click (v13.6) ---"
          ls -la sc_stream_*.html 2>/dev/null | head -30 || true

      # ═══════════════════════════════════════════════════════════════
      # MODIFICATO:
      #   • aggiunto sc_stream_*.html (post-click v13.6, diagnostica
      #     per capire quale iframe/m3u8 viene montato dentro ogni
      #     match page dopo il click sul source button)
      #   • aggiunto streamcorner_KODI.m3u
      # ═══════════════════════════════════════════════════════════════
      - name: Upload StreamCorner debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamcorner-debug
          path: |
            sc_capture.json
            sc_network.json
            sc_homepage.html
            sc_homepage_blocked.html
            sc_stream_*.html
            streamcorner_COMPLETE.m3u
            streamcorner_VLC.m3u
            streamcorner_EVENTS_LIVE.m3u
            streamcorner_KODI.m3u
            sc_assets/
          retention-days: 14
          if-no-files-found: ignore

      # ═══════════════════════════════════════════════════════════════
      # INVARIATO (già include pirlotv_debug/ con i player HTML
      # salvati durante le catene atob — utili per verificare che
      # canal-5/81/94/109/161 abbiano effettivamente zonalivetv)
      # ═══════════════════════════════════════════════════════════════
      - name: Upload PirloTV debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pirlotv-debug
          path: |
            pirlotv_capture.json
            pirlotv_COMPLETE.m3u
            pirlotv_EVENTS_LIVE.m3u
            pirlotv_VLC.m3u
            pirlotv_debug/
          retention-days: 14
          if-no-files-found: ignore

      # ═══════════════════════════════════════════════════════════════
      # MODIFICATO:
      #   • aggiunto streamcorner_KODI.m3u al commit pattern
      #     (prima veniva prodotto ma non committato)
      #   • tutto il resto invariato (pull: --rebase già corretto)
      # ═══════════════════════════════════════════════════════════════
      - name: Commit and push
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
            streamcorner_COMPLETE.m3u
            streamcorner_VLC.m3u
            streamcorner_EVENTS_LIVE.m3u
            streamcorner_KODI.m3u
            pirlotv_COMPLETE.m3u
            pirlotv_VLC.m3u
            pirlotv_EVENTS_LIVE.m3u
            pirlotv_capture.json
            sc_capture.json
            sc_network.json
            sc_homepage.html
            .sc_static_cache.json
            watchfooty_events.m3u
          skip_dirty_check: false
          pull: --rebase