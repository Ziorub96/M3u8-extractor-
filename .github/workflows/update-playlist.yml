name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright curl_cffi
          playwright install --with-deps chromium

      - name: Extract DAMITV streams
        run: python damitv_extractor.py

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py

      - name: Extract WatchFooty events
        run: python watchfooty_direct.py

      - name: Extract xyzstreams live channels
        run: |
          sleep 30
          python xyzstreams_proxy.py
        env:
          XYZPROXY_URL: ${{ secrets.XYZPROXY_URL }}

      - name: Extract SMTK sport channels
        run: python smtk_extractor.py

      - name: Extract extra sport sources
        run: python extra_sources_extractor.py

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: "combined_events.m3u combined_events_checked.m3u flussi_non_funzionanti.txt damitv_events.m3u daddylive_streams.m3u watchfooty_events.m3u xyzstreams_events.m3u smtk_sport.m3u combined_epg.xml"