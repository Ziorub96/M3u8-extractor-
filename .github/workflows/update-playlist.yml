name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright patchright curl_cffi
          playwright install --with-deps chromium
          patchright install chromium

      # ============================================================
      # Cache StreamCorner m3u8 + static config
      # ============================================================
      - name: Cache StreamCorner m3u8 results
        uses: actions/cache@v4
        with:
          path: .streamcorner_events_m3u8_cache.json
          key: streamcorner-m3u8-cache-${{ github.run_id }}
          restore-keys: |
            streamcorner-m3u8-cache-

      - name: Cache StreamCorner static config
        uses: actions/cache@v4
        with:
          path: .sc_static_cache.json
          key: sc-static-cache-${{ github.run_id }}
          restore-keys: |
            sc-static-cache-

      # ============================================================
      # ESTRATTORI ATTIVI
      # ============================================================
      - name: Extract DAMITV streams
        run: python damitv_extractor.py
        continue-on-error: true

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py
        continue-on-error: true

      - name: Extract CDN Live TV channels and events
        run: python cdnlivetv_extractor.py
        continue-on-error: true

      # ============================================================
      # StreamCorner v13.2 — SOSPESO
      # brunhild.challenges.cloudflare.com non risolve da GH Actions
      # (IP Azure datacenter non accettato da Turnstile).
      # Tenuto qui come riferimento; riattivare con proxy IT residenziale.
      # ============================================================
      - name: Extract StreamCorner streams (v13.2, sospeso)
        if: false
        run: |
          python streamcorner_extractor.py \
            --output streamcorner_COMPLETE.m3u \
            --playwright-workers 1 \
            --playwright-limit 0 \
            --ua desktop
        continue-on-error: true
        timeout-minutes: 30

      - name: Extract WatchFooty streams
        if: false  # DISABILITATO — dominio api.watchfooty.st morto
        run: python watchfooty_direct.py --max 20
        continue-on-error: true
        timeout-minutes: 25

      # ============================================================
      # PirloTV / Rojadirecta / Liveru — famiglia "tR"
      # ============================================================
      - name: Extract PirloTV streams (v1.0)
        run: |
          python pirlotv_extractor.py \
            --output pirlotv_COMPLETE.m3u \
            --max-per-site 20 \
            --timeout-per-site 300
        continue-on-error: true
        timeout-minutes: 25

      # ============================================================
      # COMBINE + CHECK
      # ============================================================
      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      # ============================================================
      # SAFETY: crea file mancanti prima del commit
      # ============================================================
      - name: Ensure all output files exist
        if: always()
        run: |
          for f in \
            combined_events.m3u \
            combined_events_checked.m3u \
            flussi_non_funzionanti.txt \
            damitv_events.m3u \
            daddylive_streams.m3u \
            cdnlivetv_channels.m3u \
            cdnlivetv_events.m3u \
            streamcorner_COMPLETE.m3u \
            streamcorner_VLC.m3u \
            streamcorner_EVENTS_LIVE.m3u \
            pirlotv_COMPLETE.m3u \
            pirlotv_VLC.m3u \
            pirlotv_EVENTS_LIVE.m3u \
            pirlotv_capture.json \
            sc_capture.json \
            watchfooty_events.m3u; do
            if [ ! -f "$f" ]; then
              echo "Crea $f (mancante)"
              if [[ "$f" == *.m3u ]]; then
                echo "#EXTM3U" > "$f"
              elif [[ "$f" == *.json ]]; then
                echo "{}" > "$f"
              else
                touch "$f"
              fi
            fi
          done
          echo "--- Stato file ---"
          ls -la *.m3u *.txt *.json 2>/dev/null || true

      # ============================================================
      # ARTIFACT StreamCorner (per debug futuro)
      # ============================================================
      - name: Upload StreamCorner debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamcorner-debug
          path: |
            sc_capture.json
            sc_network.json
            sc_homepage.html
            sc_homepage_blocked.html
          retention-days: 14
          if-no-files-found: ignore

      # ============================================================
      # ARTIFACT PirloTV (scarica anche se il commit fallisce)
      # ============================================================
      - name: Upload PirloTV debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pirlotv-debug
          path: |
            pirlotv_capture.json
            pirlotv_COMPLETE.m3u
            pirlotv_EVENTS_LIVE.m3u
            pirlotv_VLC.m3u
          retention-days: 14
          if-no-files-found: ignore

      # ============================================================
      # COMMIT
      # - KODI rimosso (ignorato da .gitignore)
      # - StreamCorner: sc_capture + sc_network + sc_homepage
      # - PirloTV: COMPLETE + VLC + EVENTS_LIVE + capture.json
      # - NIENTE backslash nel file_pattern (YAML folded scalar)
      # ============================================================
      - name: Commit and push
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
            streamcorner_COMPLETE.m3u
            streamcorner_VLC.m3u
            streamcorner_EVENTS_LIVE.m3u
            pirlotv_COMPLETE.m3u
            pirlotv_VLC.m3u
            pirlotv_EVENTS_LIVE.m3u
            pirlotv_capture.json
            sc_capture.json
            sc_network.json
            sc_homepage.html
            .sc_static_cache.json
            watchfooty_events.m3u
          skip_dirty_check: false