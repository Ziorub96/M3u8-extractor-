name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "15 * * * *"   # ogni ora al minuto 15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright
          playwright install --with-deps chromium

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py

      - name: Extract WatchFooty events
        run: python watchfooty_direct.py

      - name: Combine EPG
        run: python epg_combiner.py

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: "combined_events.m3u combined_events_checked.m3u flussi_non_funzionanti.txt daddylive_streams.m3u watchfooty_events.m3u combined_epg.xml"