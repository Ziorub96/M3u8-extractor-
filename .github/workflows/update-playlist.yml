name: Update DAMITV Playlist

on:
  schedule:
    - cron: "0 * * * *"   # ogni ora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run DAMITV extractor
        run: python damitv_extractor.py

      - name: Commit and push updated playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update playlist (automated)"
          file_pattern: "damitv_events.m3u"