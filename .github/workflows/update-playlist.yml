name: Combine M3U Playlists

on:
  schedule:
    - cron: "15 * * * *"   # ogni ora al minuto 15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Run combiner
        run: python combine_playlist.py   # ✅ nome corretto

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined playlist"
          file_pattern: "combined_events.m3u"