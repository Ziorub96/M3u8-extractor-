name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright curl_cffi
          playwright install --with-deps chromium

      # ============================================================
      # ESTRATTORI ATTIVI
      # ============================================================
      - name: Extract DAMITV streams
        run: python damitv_extractor.py
        continue-on-error: true

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py
        continue-on-error: true

      - name: Extract CDN Live TV channels and events
        run: python cdnlivetv_extractor.py
        continue-on-error: true

      - name: Extract StreamCorner streams
        run: |
          python streamcorner_extractor.py \
            --output streamcorner_COMPLETE.m3u \
            --playwright-workers 6 \
            --playwright-limit 200 \
            --playwright-priority "skygo,extra004,extra003,channels,mlb,nfl,nba,peacock_channels,slingtv_channels" \
            --split
        continue-on-error: true
        timeout-minutes: 90

      - name: Extract WatchFooty streams
        run: python watchfooty_extractor.py --max 20
        continue-on-error: true
        timeout-minutes: 25

      # ============================================================
      # STEP DISMESSI (commentati per storico)
      # ------------------------------------------------------------
      # xyzstreams  → proxy Node fragile, dipendenza esterna
      # SMTK        → canali geobloccati (richiedono VPN russa)
      # Extra Srces → 0 flussi funzionanti
      # ============================================================

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      # ============================================================
      # SAFETY: crea file mancanti prima del commit
      # ============================================================
      - name: Ensure all output files exist
        if: always()
        run: |
          for f in \
            combined_events.m3u \
            combined_events_checked.m3u \
            flussi_non_funzionanti.txt \
            damitv_events.m3u \
            daddylive_streams.m3u \
            cdnlivetv_channels.m3u \
            cdnlivetv_events.m3u \
            streamcorner_COMPLETE.m3u \
            streamcorner_VLC.m3u \
            watchfooty_events.m3u; do
            if [ ! -f "$f" ]; then
              echo "Crea $f (mancante)"
              if [[ "$f" == *.m3u ]]; then
                echo "#EXTM3U" > "$f"
              else
                touch "$f"
              fi
            fi
          done
          echo "--- Stato file ---"
          ls -la *.m3u *.txt 2>/dev/null || true

      - name: Commit and push
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
            streamcorner_COMPLETE.m3u
            streamcorner_VLC.m3u
            watchfooty_events.m3u
          skip_dirty_check: false