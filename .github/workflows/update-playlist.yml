name: Update Playlists

on:
  schedule:
    - cron: "0 */3 * * *"     # ogni 3 ore
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ----------------------------------------------------------
      # CHECKOUT + PYTHON
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev curl

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install requests urllib3 pycryptodome patchright
          patchright install chromium
          playwright install-deps chromium || true

      - name: Verify patchright
        run: |
          python -c "from patchright.sync_api import sync_playwright; print('patchright OK')"

      # ----------------------------------------------------------
      # CACHE
      # ----------------------------------------------------------
      - name: Restore StreamCorner caches
        uses: actions/cache@v4
        with:
          path: |
            .sc_runtime.json
            .sc_m3u8_cache.json
            .streamcorner_vault.json
            .streamcorner_m3u8_cache.json
            .streamcorner_events_m3u8_cache.json
          key: sc-cache-${{ github.run_id }}
          restore-keys: |
            sc-cache-

      - name: Restore CDN Live TV caches
        uses: actions/cache@v4
        with:
          path: |
            .cdnlivetv_cache.json
          key: cdnltv-cache-${{ github.run_id }}
          restore-keys: |
            cdnltv-cache-

      # ----------------------------------------------------------
      # EXTRACTORS
      # ----------------------------------------------------------
      - name: Extract CDN Live TV
        continue-on-error: true
        run: |
          python cdnlivetv_extractor.py || echo "⚠️ CDN Live TV failed, continuing"

      - name: Extract StreamCorner events (v9.2)
        continue-on-error: true
        env:
          SC_PROXY: ${{ secrets.SC_PROXY }}
        run: |
          python sc9_2.py \
            --output streamcorner_COMPLETE.m3u \
            --playwright-workers 4 \
            --playwright-limit 0 \
            || echo "⚠️ StreamCorner failed, continuing"

      - name: Extract DAMITV
        continue-on-error: true
        run: |
          if [ -f damitv_extractor.py ]; then
            python damitv_extractor.py || echo "⚠️ DAMITV failed"
          fi

      - name: Extract Daddylive
        continue-on-error: true
        run: |
          if [ -f daddylive_extractor.py ]; then
            python daddylive_extractor.py || echo "⚠️ Daddylive failed"
          fi

      # ----------------------------------------------------------
      # UPLOAD DEBUG ARTIFACTS
      # ----------------------------------------------------------
      - name: Upload StreamCorner debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamcorner-debug-${{ github.run_number }}
          path: |
            sc_capture.json
            sc_drm_report.jsonl
            streamcorner_events.json
            streamcorner_EVENTS_LIVE.m3u
            streamcorner_VLC.m3u
            streamcorner_KODI.m3u
            streamcorner_COMPLETE.m3u
          retention-days: 7
          if-no-files-found: warn

      # ----------------------------------------------------------
      # COMBINE + CHECK
      # ----------------------------------------------------------
      - name: Combine playlists
        continue-on-error: true
        run: |
          if [ -f combine_playlist.py ]; then
            python combine_playlist.py || echo "⚠️ combine failed"
          fi

      - name: Check playlists
        continue-on-error: true
        run: |
          if [ -f check_playlist.py ]; then
            python check_playlist.py || echo "⚠️ check failed"
          fi

      # ----------------------------------------------------------
      # COMMIT
      # ----------------------------------------------------------
      - name: Show git status
        run: git status --short || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "chore: update playlists [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase --autostash || true
          git push || echo "⚠️ push failed (forse non-fast-forward)"