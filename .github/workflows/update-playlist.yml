name: Combine and Check M3U Playlists

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright curl_cffi
          playwright install --with-deps chromium
          patchright install --with-deps chromium

      # ============================================================
      # ESTRATTORI ATTIVI
      # ============================================================
      - name: Extract DAMITV streams
        run: python damitv_extractor.py
        continue-on-error: true

      - name: Extract Daddylive streams
        run: python daddylive_extractor.py
        continue-on-error: true

      - name: Extract CDN Live TV channels and events
        run: python cdnlivetv_extractor.py
        continue-on-error: true

      # —— StreamCorner (v14.0 debug-first) -
      - name: Extract StreamCorner streams (Playwright stealth)
        run: python streamcorner_extractor.py --output streamcorner_COMPLETE.m3u
        continue-on-error: true

      - name: Upload StreamCorner debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamcorner-debug
          path: |
            sc_diagnosis.json
            sc_capture.json
            sc_network.json
            sc_diagnosis_why_empty.json
            sc_homepage.html
            sc_details/*.html
            sc_screenshots/*.png
          retention-days: 7

      # ============================================================
      # STEP DISMESSI (commentati per storico)
      # ------------------------------------------------------------
      # WatchFooty  → sempre vuoto
      # xyzstreams  → proxy Node fragile, dipendenza esterna
      # SMTK        → canali geobloccati (richiedono VPN russa)
      # Extra Srces → 0 flussi funzionanti
      # ============================================================

      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
            streamcorner_EVENTS_LIVE.m3u
            streamcorner_VLC.m3u
            streamcorner_COMPLETE.m3u
            sc_capture.json
